services:
  postgres:
    image: postgres:16
    container_name: mahakaal-postgres
    environment:
      POSTGRES_DB: mahakaal
      POSTGRES_USER: mahakaal
      POSTGRES_PASSWORD: mahakaal
    ports:
      - "5432:5432"
    volumes:
      - mahakaal_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: mahakaal-redis
    ports:
      - "6379:6379"

volumes:
  mahakaal_postgres:
